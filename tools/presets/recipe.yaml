presets:
  - id: ru-banks
    name: Russian banks
    category: Russia
    description: Russian bank websites and payment services from the MIT v2fly catalog and a project-owned seed.
    parts:
      - source: v2fly
        files: [category-bank-ru]
      - source: local
        files: [ru-banks-extra.txt]

  - id: ru-finance
    name: Russian finance
    category: Russia
    description: Bank of Russia, financial marketplace, and Mir payment services.
    parts:
      - source: local
        files: [ru-finance.txt]

  - id: ru-sber
    name: Sber ecosystem
    category: Russia
    description: Sber services outside the core bank domain.
    parts:
      - source: local
        files: [ru-sber.txt]

  - id: ru-state
    name: Russian government
    category: Russia
    description: Federal and regional government services from v2fly and a project-owned seed.
    parts:
      - source: v2fly
        files: [category-gov-ru]
      - source: local
        files: [ru-state-extra.txt]

  - id: ru-social
    name: Russian social media
    category: Russia
    description: Russian social networks, blogs, and messengers.
    parts:
      - source: v2fly
        files: [vk, ok, dzen, mailru-group]
      - source: local
        files: [ru-social-extra.txt]

  - id: ru-video
    name: Russian video and TV
    category: Russia
    description: Russian video services, TV channels, and cinema sites.
    parts:
      - source: v2fly
        files: [rutube, okko, wink, kinopoisk, category-entertainment-ru]
      - source: local
        files: [ru-video-extra.txt]

  - id: ru-essential
    name: Essential Russian services
    category: Russia
    description: Russian essential services from the Mintsifry availability list, operator whitelists, and official sites.
    parts:
      - source: hxehex
        files: [whitelist.txt]
      - source: chebur
        files: [moscow-tele2/domains.txt, spb-tele2/domains.txt]
      - source: local
        files: [ru-essential-extra.txt]

  - id: miro
    name: Miro
    category: Work
    description: Miro global production domains.
    parts:
      - source: local
        files: [miro.txt]
