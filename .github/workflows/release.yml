name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume or repair (empty runs Release Please)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    needs: version
    if: ${{ !cancelled() }}
    with:
      # Keep full event-commit CI when no new draft was selected successfully.
      source_ref: ${{ needs.version.result == 'success' && needs.version.outputs.recovery == 'false' && needs.version.outputs.revision || github.sha }}
      skip_payload_builds: ${{ needs.version.result == 'success' && needs.version.outputs.tag != '' && needs.version.outputs.recovery == 'false' }}

  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      # GitHub only lists drafts for callers with write access.
      contents: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      revision: ${{ steps.identity.outputs.revision }}
      id: ${{ steps.identity.outputs.id }}
      recovery: ${{ steps.identity.outputs.recovery }}
    steps:
      - name: Find the explicitly requested draft or published release
        id: pending
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          id=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$REQUESTED_TAG" '
              [.[][] | select(.tag_name == $tag)] |
              if length == 1 then .[0].id else error("expected one matching release") end')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Create release app token
        if: inputs.tag == ''
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Propose release or create draft
        if: inputs.tag == ''
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Pin release identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.pending.outputs.id || steps.release.outputs.id }}
          REQUESTED_TAG: ${{ inputs.tag }}
          CREATED_SHA: ${{ steps.release.outputs.sha }}
          CREATED: ${{ steps.release.outputs.releases_created }}
        run: |
          if [[ -z "$RELEASE_ID" ]]; then
            [[ -z "$REQUESTED_TAG" && "$CREATED" != true ]]
            exit
          fi
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          tag=$(jq -er .tag_name <<< "$release")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          if [[ -n "$REQUESTED_TAG" && "$tag" != "$REQUESTED_TAG" ]]; then
            echo 'The selected release no longer matches the requested tag.' >&2
            exit 1
          fi
          revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$CREATED_SHA" ]]; then
            [[ "$revision" == "$CREATED_SHA" ]]
            jq -e '.draft and (.prerelease | not)' <<< "$release" >/dev/null
          fi
          recovery=$(jq '.draft | not' <<< "$release")
          if [[ "$recovery" == false ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$(jq -er .target_commitish <<< "$release")" == "$revision" ]]
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$revision...main" --jq .status)
            [[ "$status" == ahead || "$status" == identical ]]
          fi
          printf 'tag=%s\nrevision=%s\nid=%s\nrecovery=%s\n' \
            "$tag" "$revision" "$RELEASE_ID" "$recovery" >> "$GITHUB_OUTPUT"

  assets:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    # Only tagged recovery needs its own legacy verification contract.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      native: ${{ steps.contract.outputs.native }}
      entware_controller: ${{ steps.contract.outputs.entware_controller }}
      bootstrap: ${{ steps.contract.outputs.bootstrap }}
      architectures: ${{ steps.contract.outputs.architectures }}
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_REVISION: ${{ needs.version.outputs.revision }}
      RECOVERY: ${{ needs.version.outputs.recovery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and select verification contract
        id: contract
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          if [[ -f tools/keenproxy.openwrt ]]; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            if [[ "$RECOVERY" != true ]]; then
              echo 'Draft releases require tools/keenproxy.openwrt in the tagged source.' >&2
              exit 1
            fi
            echo 'native=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -f tools/S99keenproxy ]]; then
            echo 'entware_controller=true' >> "$GITHUB_OUTPUT"
          else
            test "$RECOVERY" = true
            echo 'entware_controller=false' >> "$GITHUB_OUTPUT"
          fi
          # Keep older published payloads byte-compatible during repair.
          version=${RELEASE_TAG#v}
          IFS=. read -r major minor patch <<< "${version%%-*}"
          if (( 10#$major > 0 || 10#$minor > 10 || (10#$minor == 10 && 10#$patch >= 2) )); then
            test -f tools/bootstrap.sh
            echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
          fi
          # These commits introduced the four- and six-architecture layouts.
          four=afcb24932126ee4a60e862dcce6e53978f740f92
          six=e6a1a1df2730418cf9edc2a71df4cec3e99be255
          git cat-file -e "$four^{commit}"
          git cat-file -e "$six^{commit}"
          architectures='arm64 mipsle'
          if git merge-base --is-ancestor "$four" HEAD; then
            architectures+=' armv5 mipsbe'
          else
            test "$?" -eq 1
          fi
          if git merge-base --is-ancestor "$six" HEAD; then
            architectures+=' amd64 386'
          else
            test "$?" -eq 1
          fi
          echo "architectures=$architectures" >> "$GITHUB_OUTPUT"
          test "$(cat version.txt)" = "${RELEASE_TAG#v}"
          baseline=9d398fb3754036cbe35df1cf07098164ff62a9d5
          # Only immutable pre-AWG history qualifies; missing gates never select recovery.
          git cat-file -e "$baseline^{commit}"
          if git merge-base --is-ancestor HEAD "$baseline"; then
            test "$RECOVERY" = true
            echo 'historical=true' >> "$GITHUB_OUTPUT"
            evidence=".agents-work/release-legacy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            mkdir -p "$evidence"
            {
              printf 'Tag: %s\nCommit: %s\nHistorical boundary: %s\n' \
                "$RELEASE_TAG" "$(git rev-parse HEAD)" "$baseline"
              printf '%s\n' \
                'Contract: original tagged Makefile, Go tests/vet, frontend tests, network integration, full/lite cross-builds.' \
                'AWG unsupported: neither AWG stress nor memory comparison certification applies.' \
                'This manifest records contract selection, not test success; consult verification.log and exit-code when present.'
            } > "$evidence/manifest.txt"
            echo '::notice::Historical pre-AWG recovery: original tagged build/tests, not memory certification.'
          else
            status=$?
            test "$status" -eq 1 || exit "$status"
            echo 'historical=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Read pinned Go version
        id: go-version
        run: |
          version=$(awk '$1 == "go" {print $2}' go.mod)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify and build historical source without AWG certification
        if: steps.contract.outputs.historical == 'true'
        env:
          CGO_ENABLED: '0'
        run: |
          evidence=".agents-work/release-legacy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tee_pid=
          finish_verification() {
            status=$?
            trap - EXIT
            set +e
            set +x
            # Close the pipe before waiting; preserve the build failure if logging fails too.
            exec >&- 2>&-
            if [ -n "$tee_pid" ]; then
              wait "$tee_pid"
              log_status=$?
              if [ "$status" -eq 0 ]; then
                status=$log_status
              fi
            fi
            printf '%s\n' "$status" > "$evidence/exit-code"
            record_status=$?
            if [ "$status" -eq 0 ]; then
              status=$record_status
            fi
            exit "$status"
          }
          trap finish_verification EXIT
          # Retain commands, toolchains and failures without changing the tagged Makefile.
          exec > >(tee "$evidence/verification.log") 2>&1
          tee_pid=$!
          set -x
          go version
          node --version
          npm --version
          make test
          make vet
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web test
          make integration
          make build-router build-router-lite RELEASE_VERSION="$RELEASE_TAG" RELEASE_REVISION="$(git rev-parse HEAD)"
      - name: Build release binaries once
        if: env.RECOVERY == 'false'
        run: make build-router-ci build-router-lite-ci RELEASE_VERSION="$RELEASE_TAG" RELEASE_REVISION="$RELEASE_REVISION"
      # Published older tags keep their original gate/build entry points.
      - name: AWG 320 stress
        if: env.RECOVERY == 'true' && steps.contract.outputs.historical == 'false'
        run: make memory-stress
      - name: Memory regression
        if: env.RECOVERY == 'true' && steps.contract.outputs.historical == 'false'
        run: make memory-regression
      - name: Build router binaries from tagged source
        if: env.RECOVERY == 'true' && steps.contract.outputs.historical == 'false'
        run: |
          # -o only acknowledges both successful gate steps in this job.
          # Missing targets remain fatal; this is not a bypass.
          make -o memory-stress -o memory-regression build-router build-router-lite RELEASE_VERSION="$RELEASE_TAG" RELEASE_REVISION="$(git rev-parse HEAD)"
      - name: Preserve release verification evidence
        if: always() && env.RECOVERY == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-memory-regression-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .agents-work/release-legacy/
            .agents-work/memory-regression/*/results/
            .agents-work/memory-regression/*/container-tmp/
            .agents-work/memory-regression/*/manifest.txt
            .agents-work/memory-regression/*/*-build-info.txt
            .agents-work/memory-regression/*/*-build.log
            .agents-work/memory-regression/*/cleanup.log
            .agents-work/memory-regression/*/exit-code
      - name: Package source, notices, and build identity
        env:
          RELEASE_ARCHITECTURES: ${{ steps.contract.outputs.architectures }}
          RELEASE_BOOTSTRAP: ${{ steps.contract.outputs.bootstrap }}
        run: |
          source_dir=$(mktemp -d)
          trap 'rm -rf "$source_dir"' EXIT
          export SOURCE_ROOT="$source_dir/keenproxy-${RELEASE_TAG#v}"
          mkdir -p "$SOURCE_ROOT"
          git archive HEAD | tar -xf - -C "$SOURCE_ROOT"
          git ls-tree -r --name-only -z HEAD > "$SOURCE_ROOT/.release-source-files"
          tar --sort=name --mtime="$(git show -s --format=%cI HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - \
            -C "$source_dir" "keenproxy-${RELEASE_TAG#v}" \
            | gzip -n > dist/keenproxy-source.tar.gz
          cp tools/install.sh dist/install.sh
          service_assets=(install.sh)
          if [[ "$RELEASE_BOOTSTRAP" == true ]]; then
            cp tools/bootstrap.sh dist/bootstrap.sh
            service_assets+=(bootstrap.sh)
          else
            rm -f dist/bootstrap.sh
          fi
          if [ -f tools/S99keenproxy ]; then
            cp tools/S99keenproxy dist/S99keenproxy
            service_assets+=(S99keenproxy)
          fi
          if [ -f tools/keenproxy.openwrt ]; then
            cp tools/keenproxy.openwrt dist/keenproxy.openwrt
            service_assets+=(keenproxy.openwrt)
          fi
          notices=(LICENSE THIRD_PARTY_NOTICES.md)
          if [ -f PRESET_SOURCES.md ]; then
            notices+=(PRESET_SOURCES.md)
          fi
          cp "${notices[@]}" dist/
          cp -R LICENSES dist/
          if [ -f internal/catalog/presets.version ]; then
            cp --parents internal/catalog/presets.version dist/
            notices+=(internal/catalog/presets.version)
          fi
          {
            printf 'Version: %s\nCommit: %s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)"
            go version
            node --version
            npm --version
            make -s --eval='print-tags:;@echo Full tags: $(TAGS),ui; echo Lite tags: $(LITE_TAGS)' print-tags
            go list -m all
          } > dist/BUILD_INFO.txt
          tar --sort=name --mtime="$(git show -s --format=%cI HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - \
            -C dist "${notices[@]}" LICENSES \
            | gzip -n > dist/keenproxy-notices.tar.gz
          cd dist
          binaries=()
          mapfile -t architectures < <(printf '%s\n' "$RELEASE_ARCHITECTURES" | tr ' ' '\n' | LC_ALL=C sort)
          for variant in '' lite-; do
            for arch in "${architectures[@]}"; do
              binaries+=("keenproxy-${variant}linux-$arch")
            done
          done
          actual=()
          for file in keenproxy-linux-* keenproxy-lite-linux-*; do
            case "$file" in keenproxy-linux-test) continue ;; esac
            actual+=("$file")
          done
          test "$(printf '%s\n' "${actual[@]}" | LC_ALL=C sort)" = "$(printf '%s\n' "${binaries[@]}" | LC_ALL=C sort)"
          sha256sum "${binaries[@]}" keenproxy-source.tar.gz \
            keenproxy-notices.tar.gz "${service_assets[@]}" BUILD_INFO.txt > SHA256SUMS
      - name: Retain the exact release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload-${{ github.run_id }}
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            dist/keenproxy-linux-*
            dist/keenproxy-lite-linux-*
            !dist/keenproxy-linux-test
            dist/keenproxy-source.tar.gz
            dist/keenproxy-notices.tar.gz
            dist/install.sh
            dist/bootstrap.sh
            dist/S99keenproxy
            dist/keenproxy.openwrt
            dist/BUILD_INFO.txt
            dist/SHA256SUMS

  publish:
    needs: [version, checks, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.version.outputs.id }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_REVISION: ${{ needs.version.outputs.revision }}
      RELEASE_NATIVE: ${{ needs.assets.outputs.native }}
      RELEASE_ENTWARE_CONTROLLER: ${{ needs.assets.outputs.entware_controller }}
      RELEASE_BOOTSTRAP: ${{ needs.assets.outputs.bootstrap }}
      RELEASE_ARCHITECTURES: ${{ needs.assets.outputs.architectures }}
      RELEASE_RECOVERY: ${{ needs.version.outputs.recovery }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ github.run_id }}
          path: dist
      - run: bash tools/publish-release-assets.sh dist
