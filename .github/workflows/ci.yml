name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read pinned Go version
        id: go-version
        run: |
          version=$(awk '$1 == "go" {print $2}' go.mod)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go and installer tests
        run: make test
      - name: Go vet
        run: make vet
      - name: Frontend tests and production build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  memory:
    name: Memory regression and builds
    runs-on: ubuntu-24.04
    # Covers the separate AWG stress step plus the baseline gate and cross-builds.
    timeout-minutes: 60
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned Go version
        id: go-version
        run: |
          version=$(awk '$1 == "go" {print $2}' go.mod)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Own step so a stress failure is visible and does not start the baseline gate.
      # The next make -o only avoids repeating this success; GitHub skips that step if this one fails.
      - name: AWG 320 stress
        run: make memory-stress
      - name: Memory gate and router cross-builds
        run: make -o memory-stress build-router build-router-lite
      - name: Preserve memory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-regression-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .agents-work/memory-regression/*/results/
            .agents-work/memory-regression/*/container-tmp/
            .agents-work/memory-regression/*/manifest.txt
            .agents-work/memory-regression/*/*-build-info.txt
            .agents-work/memory-regression/*/*-build.log
            .agents-work/memory-regression/*/cleanup.log
            .agents-work/memory-regression/*/exit-code

  integration:
    name: Network integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read pinned Go version
        id: go-version
        run: |
          version=$(awk '$1 == "go" {print $2}' go.mod)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: go.sum
      - run: make integration
