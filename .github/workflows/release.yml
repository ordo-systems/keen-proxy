name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry missing assets (empty runs Release Please)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag_name || inputs.tag }}
    steps:
      - name: Create release app token
        if: inputs.tag == ''
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Propose or publish release
        if: inputs.tag == ''
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    # Covers separate stress and comparison steps, cross-builds, and packaging.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate tag and existing release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          gh release view "$RELEASE_TAG" --repo "$GH_REPO"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and select verification contract
        id: contract
        run: |
          test "$(cat version.txt)" = "${RELEASE_TAG#v}"
          baseline=9d398fb3754036cbe35df1cf07098164ff62a9d5
          # Only immutable pre-AWG history qualifies; missing gates never select recovery.
          git cat-file -e "$baseline^{commit}"
          if git merge-base --is-ancestor HEAD "$baseline"; then
            echo 'historical=true' >> "$GITHUB_OUTPUT"
            evidence=".agents-work/release-legacy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            mkdir -p "$evidence"
            {
              printf 'Tag: %s\nCommit: %s\nHistorical boundary: %s\n' \
                "$RELEASE_TAG" "$(git rev-parse HEAD)" "$baseline"
              printf '%s\n' \
                'Contract: original tagged Makefile, Go tests/vet, frontend tests, network integration, full/lite cross-builds.' \
                'AWG unsupported: neither AWG stress nor memory comparison certification applies.' \
                'This manifest records contract selection, not test success; consult verification.log and exit-code when present.'
            } > "$evidence/manifest.txt"
            echo '::notice::Historical pre-AWG recovery: original tagged build/tests, not memory certification.'
          else
            status=$?
            test "$status" -eq 1 || exit "$status"
            echo 'historical=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Read pinned Go version
        id: go-version
        run: |
          version=$(awk '$1 == "go" {print $2}' go.mod)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify and build historical source without AWG certification
        if: steps.contract.outputs.historical == 'true'
        env:
          CGO_ENABLED: '0'
        run: |
          evidence=".agents-work/release-legacy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tee_pid=
          finish_verification() {
            status=$?
            trap - EXIT
            set +e
            set +x
            # Close the pipe before waiting; preserve the build failure if logging fails too.
            exec >&- 2>&-
            if [ -n "$tee_pid" ]; then
              wait "$tee_pid"
              log_status=$?
              if [ "$status" -eq 0 ]; then
                status=$log_status
              fi
            fi
            printf '%s\n' "$status" > "$evidence/exit-code"
            record_status=$?
            if [ "$status" -eq 0 ]; then
              status=$record_status
            fi
            exit "$status"
          }
          trap finish_verification EXIT
          # Retain commands, toolchains and failures without changing the tagged Makefile.
          exec > >(tee "$evidence/verification.log") 2>&1
          tee_pid=$!
          set -x
          go version
          node --version
          npm --version
          make test
          make vet
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web test
          make integration
          make build-router build-router-lite RELEASE_VERSION="$RELEASE_TAG" RELEASE_REVISION="$(git rev-parse HEAD)"
      # Current sources must provide both gates; a missing target is an error.
      # -o below only acknowledges these successful same-job steps. It does not
      # make a missing gate optional. Public build targets remain so older AWG
      # tags without the CI-only names still compile.
      - name: AWG 320 stress
        if: steps.contract.outputs.historical == 'false'
        run: make memory-stress
      - name: Memory regression
        if: steps.contract.outputs.historical == 'false'
        run: make memory-regression
      - name: Build router binaries from tagged source
        if: steps.contract.outputs.historical == 'false'
        run: |
          # -o only acknowledges both successful gate steps in this job.
          # Missing targets remain fatal; this is not a bypass.
          make -o memory-stress -o memory-regression build-router build-router-lite RELEASE_VERSION="$RELEASE_TAG" RELEASE_REVISION="$(git rev-parse HEAD)"
      - name: Preserve release verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-memory-regression-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .agents-work/release-legacy/
            .agents-work/memory-regression/*/results/
            .agents-work/memory-regression/*/container-tmp/
            .agents-work/memory-regression/*/manifest.txt
            .agents-work/memory-regression/*/*-build-info.txt
            .agents-work/memory-regression/*/*-build.log
            .agents-work/memory-regression/*/cleanup.log
            .agents-work/memory-regression/*/exit-code
      - name: Package source, notices, and build identity
        run: |
          source_dir=$(mktemp -d)
          trap 'rm -rf "$source_dir"' EXIT
          export SOURCE_ROOT="$source_dir/keenproxy-${RELEASE_TAG#v}"
          mkdir -p "$SOURCE_ROOT"
          git archive HEAD | tar -xf - -C "$SOURCE_ROOT"
          git ls-tree -r --name-only -z HEAD > "$SOURCE_ROOT/.release-source-files"
          tar --sort=name --mtime="$(git show -s --format=%cI HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - \
            -C "$source_dir" "keenproxy-${RELEASE_TAG#v}" \
            | gzip -n > dist/keenproxy-source.tar.gz
          cp tools/install.sh dist/install.sh
          cp tools/S99keenproxy dist/S99keenproxy
          service_assets=(install.sh S99keenproxy)
          if [ -f tools/keenproxy.openwrt ]; then
            cp tools/keenproxy.openwrt dist/keenproxy.openwrt
            service_assets+=(keenproxy.openwrt)
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp -R LICENSES dist/
          {
            printf 'Version: %s\nCommit: %s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)"
            go version
            node --version
            npm --version
            make -s --eval='print-tags:;@echo Full tags: $(TAGS),ui; echo Lite tags: $(LITE_TAGS)' print-tags
            go list -m all
          } > dist/BUILD_INFO.txt
          tar --sort=name --mtime="$(git show -s --format=%cI HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - \
            -C dist LICENSE THIRD_PARTY_NOTICES.md LICENSES \
            | gzip -n > dist/keenproxy-notices.tar.gz
          cd dist
          sha256sum keenproxy-linux-* keenproxy-lite-linux-* keenproxy-source.tar.gz \
            keenproxy-notices.tar.gz "${service_assets[@]}" BUILD_INFO.txt > SHA256SUMS
      - name: Attach missing assets without overwriting published files
        run: |
          assets=(dist/keenproxy-linux-* dist/keenproxy-lite-linux-* \
            dist/keenproxy-source.tar.gz dist/keenproxy-notices.tar.gz \
            dist/install.sh dist/S99keenproxy dist/BUILD_INFO.txt dist/SHA256SUMS)
          if [ -f tools/keenproxy.openwrt ]; then
            assets+=(dist/keenproxy.openwrt)
          fi
          existing=$(mktemp -d)
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$existing/names"
          for asset in "${assets[@]}"; do
            name=$(basename "$asset")
            if grep -Fxq "$name" "$existing/names"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing"
              cmp "$asset" "$existing/$name"
            fi
          done
          for asset in "${assets[@]}"; do
            if ! grep -Fxq "$(basename "$asset")" "$existing/names"; then
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GH_REPO"
            fi
          done
